# GiveBlack Admin – admin.giveblackapp.com
# Copy to: /etc/nginx/sites-available/admin.giveblackapp.com
# Then: sudo ln -sf /etc/nginx/sites-available/admin.giveblackapp.com /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# DNS: A record admin.giveblackapp.com → VPS (or Cloudflare proxied to origin).
# SSL: sudo certbot --nginx -d admin.giveblackapp.com
#
# Dashboard: https://admin.giveblackapp.com/
# API (from admin UI): same-host /app/... (VITE_API_URL=https://admin.giveblackapp.com/app) or giveblackapp.com/app

server {
    listen 80;
    server_name admin.giveblackapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.giveblackapp.com;

    ssl_certificate     /etc/letsencrypt/live/admin.giveblackapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.giveblackapp.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/giveblack/apps/admin/dist;
    index index.html;

    # Legacy /backoffice/* bookmarks → root paths
    location ~ ^/backoffice/?(.*)$ {
        return 301 /$1;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
